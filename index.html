<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📐 面積金頭腦小遊戲</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            background-color: #f0f8ff;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            background-color: #fff;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b6b;
            font-size: 32px;
        }
        .setup-section {
            text-align: left;
            background-color: #fff9c4;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .checkbox-group label {
            display: inline-block;
            margin: 10px 15px 10px 0;
            font-size: 18px;
            cursor: pointer;
            padding: 8px 12px;
            background-color: #e0f7fa;
            border-radius: 8px;
            border: 2px solid #b2ebf2;
        }
        .checkbox-group input {
            transform: scale(1.5);
            margin-right: 8px;
            cursor: pointer;
        }
        .highlight-label {
            background-color: #ffeaa7 !important;
            border-color: #fdcb6e !important;
            font-weight: bold;
        }
        button {
            background-color: #4ecdc4;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        button:hover {
            background-color: #45b7d1;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(2px);
        }
        #play-area {
            display: none;
        }
        #question-box {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            background-color: #e8f8f5;
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            border: 3px dashed #1abc9c;
        }
        
        /* 計算題區域樣式 */
        #calc-input-area {
            margin-bottom: 20px;
        }
        #answer-input {
            font-size: 24px;
            padding: 10px;
            width: 150px;
            text-align: center;
            border: 3px solid #bdc3c7;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* 選擇題區域樣式 */
        #mc-options-area {
            display: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mc-btn {
            background-color: #3498db;
            font-size: 18px;
            padding: 15px;
            width: 100%;
        }
        .mc-btn:hover {
            background-color: #2980b9;
        }

        #score-board {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #8e44ad;
        }
        #feedback {
            font-size: 22px;
            font-weight: bold;
            height: 30px;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>📐 面積金頭腦</h1>

    <!-- 設定區域 -->
    <div id="setup-area" class="setup-section">
        <h3>請勾選想要練習的題型 (可複選)：</h3>
        <div class="checkbox-group" id="shape-checkboxes">
            <!-- 新增公式選擇區 -->
            <label class="highlight-label"><input type="checkbox" value="formula" checked> 🧠 面積公式記憶</label>
            <hr style="border: 1px dashed #ccc; margin: 10px 0;">
            <label><input type="checkbox" value="square" checked> 正方形</label>
            <label><input type="checkbox" value="rectangle" checked> 長方形</label>
            <label><input type="checkbox" value="triangle"> 三角形</label>
            <label><input type="checkbox" value="parallelogram"> 平行四邊形</label>
            <label><input type="checkbox" value="trapezoid"> 梯形</label>
            <label><input type="checkbox" value="circle"> 圓形(含3.14)</label>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button onclick="startGame()">🚀 開始挑戰</button>
        </div>
    </div>

    <!-- 遊戲區域 -->
    <div id="play-area">
        <div id="score-board">
            <span>🏆 得分: <span id="score">0</span></span>
            <span>🔥 連擊: <span id="combo">0</span></span>
        </div>
        
        <div id="question-box">這裡是題目</div>
        
        <!-- 計算題輸入區 -->
        <div id="calc-input-area">
            <input type="number" id="answer-input" placeholder="輸入面積" step="0.01" onkeypress="handleEnter(event)">
            <br>
            <button onclick="checkCalcAnswer()">📝 送出答案</button>
        </div>

        <!-- 公式選擇題區 -->
        <div id="mc-options-area">
            <!-- 按鈕會由 JavaScript 動態產生 -->
        </div>
        
        <div id="feedback"></div>

        <button onclick="endGame()" style="background-color: #ff9f43; margin-top: 10px;">🛑 結束練習</button>
    </div>
</div>

<script>
    let score = 0;
    let combo = 0;
    let currentAnswer = null;
    let currentQuestionType = 'calc'; // 'calc' 或 'mc'
    let selectedShapes = [];
    let isWaitingForNext = false; // 防止狂按按鈕

    // 題庫與產生器
    const shapeGenerators = {
        formula: {
            name: '公式',
            generate: () => {
                const formulas = [
                    { shape: '正方形', correct: '邊長 × 邊長', wrongs: ['邊長 × 4', '長 × 寬', '底 × 高'] },
                    { shape: '長方形', correct: '長 × 寬', wrongs: ['(長 + 寬) × 2', '底 × 高', '邊長 × 邊長'] },
                    { shape: '三角形', correct: '底 × 高 ÷ 2', wrongs: ['底 × 高', '(上底+下底) × 高 ÷ 2', '邊長 × 邊長'] },
                    { shape: '平行四邊形', correct: '底 × 高', wrongs: ['底 × 高 ÷ 2', '長 × 寬', '(上底+下底) × 高 ÷ 2'] },
                    { shape: '梯形', correct: '(上底 + 下底) × 高 ÷ 2', wrongs: ['(上底 + 下底) × 高', '底 × 高 ÷ 2', '長 × 寬'] },
                    { shape: '圓形', correct: '半徑 × 半徑 × 3.14', wrongs: ['直徑 × 3.14', '半徑 × 2 × 3.14', '底 × 高'] }
                ];
                let item = formulas[Math.floor(Math.random() * formulas.length)];
                let options = [item.correct, ...item.wrongs];
                // 將選項隨機打亂
                options.sort(() => Math.random() - 0.5);
                
                return { 
                    type: 'mc', 
                    q: `請問「<span style="color:#e74c3c">${item.shape}</span>」的面積公式是哪一個？`, 
                    a: item.correct,
                    options: options 
                };
            }
        },
        square: {
            name: '正方形',
            generate: () => {
                let a = Math.floor(Math.random() * 15) + 2;
                return { type: 'calc', q: `邊長為 ${a} 公分的正方形，<br>面積是多少平方公分？`, a: a * a };
            }
        },
        rectangle: {
            name: '長方形',
            generate: () => {
                let l = Math.floor(Math.random() * 15) + 2;
                let w = Math.floor(Math.random() * 15) + 2;
                return { type: 'calc', q: `長 ${l} 公分、寬 ${w} 公分的長方形，<br>面積是多少平方公分？`, a: l * w };
            }
        },
        triangle: {
            name: '三角形',
            generate: () => {
                let b = Math.floor(Math.random() * 15) + 2;
                let h = Math.floor(Math.random() * 10) * 2 + 2;
                return { type: 'calc', q: `底為 ${b} 公分、高為 ${h} 公分的三角形，<br>面積是多少平方公分？`, a: (b * h) / 2 };
            }
        },
        parallelogram: {
            name: '平行四邊形',
            generate: () => {
                let b = Math.floor(Math.random() * 15) + 2;
                let h = Math.floor(Math.random() * 15) + 2;
                return { type: 'calc', q: `底為 ${b} 公分、高為 ${h} 公分的平行四邊形，<br>面積是多少平方公分？`, a: b * h };
            }
        },
        trapezoid: {
            name: '梯形',
            generate: () => {
                let top = Math.floor(Math.random() * 10) + 2;
                let bottom = Math.floor(Math.random() * 10) + 2;
                let h = Math.floor(Math.random() * 10) * 2 + 2;
                return { type: 'calc', q: `上底 ${top} 公分、下底 ${bottom} 公分、<br>高為 ${h} 公分的梯形，<br>面積是多少平方公分？`, a: ((top + bottom) * h) / 2 };
            }
        },
        circle: {
            name: '圓形',
            generate: () => {
                let r = (Math.floor(Math.random() * 5) + 1) * 2; 
                let ans = Math.round(r * r * 3.14 * 100) / 100;
                return { type: 'calc', q: `半徑為 ${r} 公分的圓形，<br>面積是多少平方公分？ (圓周率以 3.14 計算)`, a: ans };
            }
        }
    };

    function startGame() {
        selectedShapes = [];
        const checkboxes = document.querySelectorAll('#shape-checkboxes input[type="checkbox"]:checked');
        checkboxes.forEach((cb) => {
            selectedShapes.push(cb.value);
        });

        if (selectedShapes.length === 0) {
            alert("⚠️ 請至少勾選一種題型才能開始喔！");
            return;
        }

        score = 0;
        combo = 0;
        isWaitingForNext = false;
        updateScoreBoard();
        document.getElementById("feedback").innerHTML = "";
        
        document.getElementById("setup-area").style.display = "none";
        document.getElementById("play-area").style.display = "block";

        nextQuestion();
    }

    function nextQuestion() {
        isWaitingForNext = false;
        document.getElementById("feedback").innerHTML = "";

        // 隨機抽選題型
        const randomType = selectedShapes[Math.floor(Math.random() * selectedShapes.length)];
        const questionData = shapeGenerators[randomType].generate();
        
        currentAnswer = questionData.a;
        currentQuestionType = questionData.type;
        document.getElementById("question-box").innerHTML = questionData.q;

        const calcArea = document.getElementById("calc-input-area");
        const mcArea = document.getElementById("mc-options-area");

        if (questionData.type === 'mc') {
            // 顯示選擇題介面
            calcArea.style.display = "none";
            mcArea.style.display = "flex";
            mcArea.innerHTML = ""; // 清空舊按鈕
            
            questionData.options.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "mc-btn";
                btn.innerText = opt;
                btn.onclick = () => processAnswer(opt === currentAnswer);
                mcArea.appendChild(btn);
            });
        } else {
            // 顯示計算題介面
            mcArea.style.display = "none";
            calcArea.style.display = "block";
            
            const inputField = document.getElementById("answer-input");
            inputField.value = "";
            inputField.focus();
        }
    }

    // 計算題按鈕送出
    function checkCalcAnswer() {
        if (isWaitingForNext || currentQuestionType !== 'calc') return;
        
        const userAnswer = parseFloat(document.getElementById("answer-input").value);
        if (isNaN(userAnswer)) {
            document.getElementById("feedback").innerHTML = "<span class='wrong'>⚠️ 請輸入數字喔！</span>";
            return;
        }
        processAnswer(userAnswer === currentAnswer);
    }

    // 處理答案對錯的共用邏輯
    function processAnswer(isCorrect) {
        if (isWaitingForNext) return;
        isWaitingForNext = true; // 鎖定直到下一題出現

        const feedbackEl = document.getElementById("feedback");

        if (isCorrect) {
            score += 10 + (combo * 2); 
            combo += 1;
            feedbackEl.innerHTML = `<span class='correct'>🎉 答對了！太棒了！</span>`;
            updateScoreBoard();
            setTimeout(nextQuestion, 1000); 
        } else {
            combo = 0;
            feedbackEl.innerHTML = `<span class='wrong'>❌ 答錯了，正確答案是：<br><strong>${currentAnswer}</strong></span>`;
            updateScoreBoard();
            setTimeout(nextQuestion, 2500); // 答錯停留久一點讓學生看答案
        }
    }

    // 計算題 Enter 鍵支援
    function handleEnter(e) {
        if (e.key === 'Enter' && currentQuestionType === 'calc') {
            checkCalcAnswer();
        }
    }

    function updateScoreBoard() {
        document.getElementById("score").innerText = score;
        document.getElementById("combo").innerText = combo;
    }

    function endGame() {
        alert(`遊戲結束！\n你總共得到了 ${score} 分 🏆\n繼續保持，數學會越來越棒喔！`);
        document.getElementById("setup-area").style.display = "block";
        document.getElementById("play-area").style.display = "none";
    }
</script>

</body>
</html>
